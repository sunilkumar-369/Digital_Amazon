
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault - Digital Marketplace</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM (UMD versions for browser) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel standalone to compile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#1D3557',
                        orange: '#FB8500',
                        yellow: '#FFB703',
                        teal: '#2A9D8F'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Custom animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>
    <!-- Root element where React will attach -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- MOCK DATA ---
        const MOCK_PRODUCTS = [
            { id: 1, title: "Pro Video Editing LUTs Pack", category: "Video Assets", price: 49.99, rating: 4.9, reviews: 1284, img: "https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?auto=format&fit=crop&w=800&q=80", author: "Cinematic Studio" },
            { id: 2, title: "Advanced SaaS Dashboard UI Kit", category: "Source Code", price: 79.00, rating: 4.8, reviews: 850, img: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=800&q=80", author: "UI Forge" },
            { id: 3, title: "Midjourney Prompt Mastery E-Book", category: "E-Books", price: 19.50, rating: 5.0, reviews: 3422, img: "https://images.unsplash.com/photo-1589998059171-988d887df646?auto=format&fit=crop&w=800&q=80", author: "AI Visions" },
            { id: 4, title: "Cinematic Sound Effects Library", category: "Audio", price: 29.99, rating: 4.7, reviews: 563, img: "https://images.unsplash.com/photo-1615554851459-4f7db201d4a6?auto=format&fit=crop&w=800&q=80", author: "Audio Hub" },
            { id: 5, title: "Notion Life Planner OS", category: "Templates", price: 24.00, rating: 4.9, reviews: 2100, img: "https://images.unsplash.com/photo-1586281380349-632531db7ed4?auto=format&fit=crop&w=800&q=80", author: "Productivity Inc" },
            { id: 6, title: "Viral YouTube Thumbnail PSDs", category: "Graphics", price: 15.00, rating: 4.8, reviews: 512, img: "https://images.unsplash.com/photo-1611162617474-5b21e879e113?auto=format&fit=crop&w=800&q=80", author: "Creator DAO" },
            { id: 7, title: "Blender 3D Environments Course", category: "Courses", price: 149.00, rating: 5.0, reviews: 1024, img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80", author: "3D Masters" },
            { id: 8, title: "Shopify Conversion Theme", category: "Source Code", price: 89.00, rating: 4.6, reviews: 442, img: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=800&q=80", author: "Ecom Devs" }
        ];

        const CATEGORIES = ["All", "Source Code", "Video Assets", "E-Books", "Audio", "Templates", "Graphics", "Courses"];

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [activeView, setActiveView] = useState('buyer'); // 'buyer' or 'seller'
            const [cart, setCart] = useState([]);
            const [isAuthOpen, setIsAuthOpen] = useState(false);
            const [user, setUser] = useState(null); 
            const [toast, setToast] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [activeCategory, setActiveCategory] = useState('All');

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 3000);
            };

            const addToCart = (product) => {
                if (!cart.find(item => item.id === product.id)) {
                    setCart([...cart, product]);
                    showToast(`${product.title} added to cart!`);
                } else {
                    showToast(`Item is already in your cart`);
                }
            };

            const loginUser = (role) => {
                setUser({ name: "Alex Morgan", role: role, avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Alex" });
                setActiveView(role);
                setIsAuthOpen(false);
                showToast(`Successfully logged in as ${role}`);
            };

            const filteredProducts = MOCK_PRODUCTS.filter(p => 
                (activeCategory === 'All' || p.category === activeCategory) &&
                p.title.toLowerCase().includes(searchQuery.toLowerCase())
            );

            const Navbar = () => (
                <nav className="bg-navy text-white sticky top-0 z-50 shadow-xl border-b border-white/10">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center h-20">
                            
                            {/* Logo */}
                            <div onClick={() => setActiveView('buyer')} className="flex items-center gap-3 cursor-pointer group">
                                <div className="bg-gradient-to-tr from-orange to-yellow p-2.5 rounded-xl shadow-lg group-hover:scale-105 transition-transform">
                                    <i className="fa-solid fa-shield-check text-white text-xl"></i>
                                </div>
                                <span className="text-2xl font-black tracking-tight text-white">
                                    TrustVault<span className="text-orange">.</span>
                                </span>
                            </div>

                            {/* View Switcher (Visible if logged in to demonstrate both sides) */}
                            {user && (
                                <div className="hidden md:flex bg-black/20 p-1.5 rounded-xl backdrop-blur-md border border-white/10">
                                    <button 
                                        onClick={() => setActiveView('buyer')}
                                        className={`px-6 py-2 rounded-lg text-sm font-bold transition-all ${activeView === 'buyer' ? 'bg-white text-navy shadow-lg' : 'text-slate-300 hover:text-white'}`}
                                    >
                                        Customer Store
                                    </button>
                                    <button 
                                        onClick={() => setActiveView('seller')}
                                        className={`px-6 py-2 rounded-lg text-sm font-bold transition-all ${activeView === 'seller' ? 'bg-teal text-white shadow-lg' : 'text-slate-300 hover:text-white'}`}
                                    >
                                        Seller Hub
                                    </button>
                                </div>
                            )}

                            {/* Actions */}
                            <div className="flex items-center gap-5">
                                {activeView === 'buyer' && (
                                    <div className="relative cursor-pointer group p-2">
                                        <i className="fa-solid fa-shopping-cart text-xl text-slate-300 group-hover:text-white transition-colors"></i>
                                        {cart.length > 0 && (
                                            <span className="absolute top-0 right-0 bg-orange text-[10px] font-black w-5 h-5 flex items-center justify-center rounded-full shadow-lg border-2 border-navy">
                                                {cart.length}
                                            </span>
                                        )}
                                    </div>
                                )}
                                
                                {user ? (
                                    <div className="flex items-center gap-4 pl-4 border-l border-white/20">
                                        <div className="hidden sm:block text-right">
                                            <p className="text-[10px] font-bold text-orange uppercase tracking-widest">{user.role}</p>
                                            <p className="text-sm font-bold">{user.name}</p>
                                        </div>
                                        <div className="w-10 h-10 rounded-full bg-slate-200 border-2 border-teal overflow-hidden cursor-pointer shadow-lg">
                                            <img src={user.avatar} alt="Avatar" />
                                        </div>
                                        <button onClick={() => { setUser(null); setActiveView('buyer'); }} className="text-slate-400 hover:text-white transition-colors" title="Logout">
                                            <i className="fa-solid fa-sign-out-alt text-xl"></i>
                                        </button>
                                    </div>
                                ) : (
                                    <button 
                                        onClick={() => setIsAuthOpen(true)}
                                        className="bg-white text-navy hover:bg-slate-100 font-bold px-6 py-2.5 rounded-xl transition-all shadow-lg flex items-center gap-2"
                                    >
                                        <i className="fa-solid fa-user text-sm"></i> Sign In
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                </nav>
            );

            const BuyerStorefront = () => (
                <div className="bg-slate-50 min-h-screen pb-24 animate-fade-in">
                    {/* Glassmorphism Hero */}
                    <div className="relative bg-navy pt-24 pb-36 px-4 overflow-hidden">
                        <div className="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-teal rounded-full mix-blend-screen filter blur-[150px] opacity-30"></div>
                        <div className="absolute bottom-[-20%] right-[-10%] w-[600px] h-[600px] bg-orange rounded-full mix-blend-screen filter blur-[150px] opacity-20"></div>

                        <div className="relative z-10 max-w-5xl mx-auto text-center">
                            <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-white text-sm font-bold mb-8 shadow-xl">
                                <i className="fa-solid fa-shield-check text-teal"></i> 100% Secure Instant Digital Delivery
                            </div>
                            <h1 className="text-5xl md:text-7xl font-black text-white mb-6 leading-[1.1] tracking-tight">
                                The Ultimate Asset Vault <br className="hidden md:block"/> for <span className="text-transparent bg-clip-text bg-gradient-to-r from-orange to-yellow">Digital Creators</span>
                            </h1>
                            <p className="text-slate-300 mb-12 text-lg md:text-xl max-w-2xl mx-auto font-medium">
                                Discover thousands of premium e-books, templates, and software codes. Buy once, download instantly, keep forever.
                            </p>
                            
                            {/* Glass Search Bar */}
                            <div className="bg-white/10 backdrop-blur-xl border border-white/20 p-2.5 rounded-2xl flex items-center shadow-2xl max-w-3xl mx-auto focus-within:scale-[1.02] transition-transform duration-300">
                                <i className="fa-solid fa-search text-slate-300 ml-4 mr-3 text-xl"></i>
                                <input 
                                    type="text" 
                                    placeholder="Search UI Kits, LUTs, AI Prompts..." 
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full bg-transparent text-white placeholder-slate-300 focus:outline-none text-lg px-2 font-medium"
                                />
                                <button className="bg-orange hover:bg-[#e07700] transition-colors text-white font-black py-3 px-8 rounded-xl shadow-lg">
                                    Search
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Categories & Products */}
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-20 -mt-10">
                        <div className="flex gap-3 overflow-x-auto pb-4 mb-8 hide-scrollbar">
                            {CATEGORIES.map(cat => (
                                <button 
                                    key={cat}
                                    onClick={() => setActiveCategory(cat)}
                                    className={`whitespace-nowrap px-6 py-3 rounded-xl font-bold transition-all shadow-sm ${activeCategory === cat ? 'bg-navy text-white shadow-md' : 'bg-white text-slate-600 hover:bg-slate-50 border border-slate-200'}`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>

                        <div className="flex justify-between items-end mb-8 mt-4">
                            <h2 className="text-3xl font-black text-slate-800 tracking-tight">Trending Assets</h2>
                        </div>
                        
                        {/* Premium Product Cards */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                            {filteredProducts.map((product) => (
                                <div key={product.id} className="bg-white rounded-3xl shadow-lg border border-slate-100 overflow-hidden hover:-translate-y-1.5 transition-all duration-300 flex flex-col group">
                                    <div className="h-56 overflow-hidden relative bg-slate-100">
                                        <img src={product.img} alt={product.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                                        <div className="absolute top-4 left-4 bg-white/80 backdrop-blur-md px-3 py-1.5 rounded-lg text-xs font-black text-navy shadow-sm uppercase tracking-wide">
                                            {product.category}
                                        </div>
                                    </div>
                                    <div className="p-6 flex flex-col flex-grow">
                                        <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5 flex items-center gap-1">
                                            By {product.author} <i className="fa-solid fa-circle-check text-teal"></i>
                                        </p>
                                        <h3 className="font-extrabold text-xl text-slate-800 leading-snug mb-3 flex-grow group-hover:text-navy transition-colors">{product.title}</h3>
                                        
                                        <div className="flex items-center gap-1.5 mb-6">
                                            <div className="flex text-yellow">
                                                {[...Array(5)].map((_, i) => (
                                                    <i key={i} className={`fa-solid fa-star text-sm ${i < Math.floor(product.rating) ? '' : 'text-slate-300'}`}></i>
                                                ))}
                                            </div>
                                            <span className="text-sm font-bold text-slate-700 ml-1">{product.rating}</span>
                                            <span className="text-xs font-medium text-slate-400">({product.reviews.toLocaleString()})</span>
                                        </div>
                                        
                                        <div className="flex items-center justify-between mt-auto pt-4 border-t border-slate-100">
                                            <div>
                                                <span className="text-xs text-slate-400 font-bold block leading-none mb-1">One-time price</span>
                                                <span className="text-3xl font-black text-navy leading-none">${product.price}</span>
                                            </div>
                                            <button 
                                                onClick={() => addToCart(product)}
                                                className="bg-navy hover:bg-orange text-white p-4 rounded-2xl transition-all shadow-md hover:shadow-lg flex items-center justify-center group/btn"
                                            >
                                                <i className="fa-solid fa-shopping-cart text-lg group-hover/btn:scale-110 transition-transform"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            const SellerDashboard = () => (
                <div className="flex min-h-[calc(100vh-80px)] bg-slate-50 animate-fade-in">
                    {/* Sidebar */}
                    <aside className="w-72 bg-white border-r border-slate-200 hidden md:flex flex-col z-10 shadow-sm">
                        <div className="p-8 flex-grow">
                            <p className="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-6">Store Management</p>
                            <nav className="space-y-2">
                                <button className="w-full flex items-center gap-4 px-5 py-4 bg-navy text-white rounded-2xl font-bold shadow-md transition-all">
                                    <i className="fa-solid fa-chart-line w-5"></i> Performance
                                </button>
                                <button className="w-full flex items-center gap-4 px-5 py-4 text-slate-600 hover:bg-slate-50 hover:text-navy rounded-2xl font-bold transition-all">
                                    <i className="fa-solid fa-box w-5"></i> Digital Inventory
                                </button>
                                <button className="w-full flex items-center gap-4 px-5 py-4 text-slate-600 hover:bg-slate-50 hover:text-navy rounded-2xl font-bold transition-all">
                                    <i className="fa-solid fa-money-bill-wave w-5"></i> Financial Reports
                                </button>
                            </nav>
                        </div>
                    </aside>

                    {/* Main Workspace */}
                    <main className="flex-1 p-8 lg:p-12 overflow-y-auto">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-6">
                            <div>
                                <h1 className="text-4xl font-black text-navy tracking-tight">Command Center</h1>
                                <p className="text-slate-500 mt-2 font-medium text-lg">Here's the pulse of your digital empire today.</p>
                            </div>
                            <button className="bg-gradient-to-r from-orange to-yellow text-white px-8 py-4 rounded-2xl font-black shadow-lg hover:-translate-y-1 transition-all flex items-center gap-3">
                                <i className="fa-solid fa-cloud-arrow-up text-xl"></i> Upload New Asset
                            </button>
                        </div>

                        {/* Analytics Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12">
                            <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm flex items-center gap-6 group hover:border-teal/30 transition-colors">
                                <div className="bg-gradient-to-br from-teal to-[#218074] p-5 rounded-2xl text-white shadow-lg">
                                    <i className="fa-solid fa-dollar-sign text-2xl"></i>
                                </div>
                                <div>
                                    <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5">Net Revenue</p>
                                    <h3 className="text-4xl font-black text-navy tracking-tight">$34,850</h3>
                                    <p className="text-sm text-teal font-bold mt-2 bg-teal/10 inline-flex px-2 py-1 rounded-md">
                                        <i className="fa-solid fa-arrow-trend-up mr-1"></i> +24.5%
                                    </p>
                                </div>
                            </div>
                            
                            <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm flex items-center gap-6 group hover:border-navy/30 transition-colors">
                                <div className="bg-gradient-to-br from-navy to-[#112238] p-5 rounded-2xl text-white shadow-lg">
                                    <i className="fa-solid fa-download text-2xl"></i>
                                </div>
                                <div>
                                    <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5">Total Downloads</p>
                                    <h3 className="text-4xl font-black text-navy tracking-tight">4,842</h3>
                                    <p className="text-sm text-teal font-bold mt-2 bg-teal/10 inline-flex px-2 py-1 rounded-md">
                                        <i className="fa-solid fa-arrow-trend-up mr-1"></i> +12.2%
                                    </p>
                                </div>
                            </div>

                            <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm flex items-center gap-6 group hover:border-orange/30 transition-colors">
                                <div className="bg-gradient-to-br from-orange to-[#e07700] p-5 rounded-2xl text-white shadow-lg">
                                    <i className="fa-solid fa-box text-2xl"></i>
                                </div>
                                <div>
                                    <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5">Active Assets</p>
                                    <h3 className="text-4xl font-black text-navy tracking-tight">12</h3>
                                    <p className="text-sm text-orange font-bold mt-2 bg-orange/10 inline-flex px-2 py-1 rounded-md">2 pending review</p>
                                </div>
                            </div>
                        </div>

                        {/* Data Table */}
                        <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                            <div className="px-8 py-6 border-b border-slate-100 bg-slate-50/80">
                                <h3 className="text-xl font-black text-navy">Recent Transactions</h3>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="text-slate-400 text-xs uppercase tracking-widest border-b border-slate-100 bg-white">
                                            <th className="px-8 py-5 font-black">Asset Name</th>
                                            <th className="px-8 py-5 font-black">Purchase Date</th>
                                            <th className="px-8 py-5 font-black">Customer</th>
                                            <th className="px-8 py-5 font-black">Amount</th>
                                            <th className="px-8 py-5 font-black text-right">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-sm">
                                        {[
                                            { name: "Pro Video Editing LUTs Pack", date: "Today, 10:23 AM", user: "alex@agency.com", price: "$49.99" },
                                            { name: "Midjourney Mastery E-Book", date: "Today, 08:15 AM", user: "sarah.m@design.co", price: "$19.50" },
                                            { name: "Advanced SaaS Dashboard UI Kit", date: "Yesterday, 4:30 PM", user: "dev@startup.io", price: "$79.00" },
                                        ].map((row, i) => (
                                            <tr key={i} className="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                                                <td className="px-8 py-6 font-bold text-navy flex items-center gap-3">
                                                    <div className="w-10 h-10 rounded-lg bg-slate-100 overflow-hidden">
                                                        <img src={MOCK_PRODUCTS[i].img} className="w-full h-full object-cover" alt="" />
                                                    </div>
                                                    {row.name}
                                                </td>
                                                <td className="px-8 py-6 font-medium text-slate-500">{row.date}</td>
                                                <td className="px-8 py-6 font-medium text-slate-500">{row.user}</td>
                                                <td className="px-8 py-6 font-black text-navy text-lg">{row.price}</td>
                                                <td className="px-8 py-6 text-right">
                                                    <span className="bg-teal/10 text-teal border border-teal/20 px-4 py-1.5 rounded-lg text-xs font-black tracking-widest inline-flex items-center gap-1">
                                                        <i className="fa-solid fa-check"></i> DELIVERED
                                                    </span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>
                </div>
            );

            const AuthModal = () => (
                <div className="fixed inset-0 bg-navy/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-white rounded-[2rem] w-full max-w-md overflow-hidden shadow-2xl relative">
                        <div className="bg-navy p-8 text-center relative">
                            <i className="fa-solid fa-shield-check text-5xl text-orange mb-4"></i>
                            <h2 className="text-3xl font-black text-white tracking-tight">Welcome to TrustVault</h2>
                            <p className="text-slate-300 mt-2 font-medium">Select your account type to proceed</p>
                            <button onClick={() => setIsAuthOpen(false)} className="absolute top-5 right-5 text-white/50 hover:text-white transition-colors">
                                <i className="fa-solid fa-times text-xl"></i>
                            </button>
                        </div>
                        
                        <div className="p-8 space-y-4">
                            <button 
                                onClick={() => loginUser('buyer')}
                                className="w-full bg-slate-50 hover:bg-navy hover:text-white text-navy border-2 border-slate-100 hover:border-navy font-bold py-4 rounded-2xl transition-all flex items-center justify-center gap-3 group"
                            >
                                <i className="fa-solid fa-shopping-cart text-slate-400 group-hover:text-orange"></i> Continue as Buyer
                            </button>
                            <button 
                                onClick={() => loginUser('seller')}
                                className="w-full bg-slate-50 hover:bg-teal hover:text-white text-navy border-2 border-slate-100 hover:border-teal font-bold py-4 rounded-2xl transition-all flex items-center justify-center gap-3 group"
                            >
                                <i className="fa-solid fa-chart-line text-slate-400 group-hover:text-white"></i> Continue as Seller
                            </button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div>
                    {toast && (
                        <div className="fixed bottom-8 right-8 z-[110] bg-navy text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 animate-fade-in border border-white/10">
                            <i className="fa-solid fa-circle-check text-teal text-xl"></i>
                            <span className="font-bold">{toast}</span>
                        </div>
                    )}
                    <Navbar />
                    {activeView === 'buyer' ? <BuyerStorefront /> : <SellerDashboard />}
                    {isAuthOpen && <AuthModal />}
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
